[package]
name = "bitplane-core"
description = "The bitplane machine contract: the Engine traits, the wire types and the error envelope."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# ADR-0001: bitplane is deliberately not published to crates.io. Saying so here
# means an accidental `cargo publish` is refused rather than regretted.
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
# Same pins as bitplane-cc, so the TypeScript both emit agrees (ADR-0010).
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
specta-serde = { version = "=0.0.12", optional = true }
specta-typescript = { version = "=0.0.12", optional = true }

[features]
# Derives `specta::Type` on the wire types and checks `bp-contract.ts` against
# them. Off by default: a plain build compiles none of it.
typescript = ["dep:specta", "dep:specta-serde", "dep:specta-typescript"]
