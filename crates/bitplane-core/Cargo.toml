[package]
name = "bitplane-core"
description = "The bitplane machine contract: the Engine traits, the wire types and the error envelope."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# ADR-0001: bitplane is deliberately not published to crates.io. Saying so here
# means an accidental `cargo publish` is refused rather than regretted.
publish = false

[features]
# TypeScript for the wire types: `bp-contract.ts`, generated by
# `cargo test -p bitplane-core --features ts --test contract`. Off by default,
# because nothing `bp` does at runtime needs it.
ts = ["dep:specta", "dep:specta-serde", "dep:specta-typescript"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
# Pinned exactly to bitplane-cc's, so the types it generates and the ones it
# imports from here come out of one generator.
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
specta-serde = { version = "=0.0.12", optional = true }
specta-typescript = { version = "=0.0.12", optional = true }
